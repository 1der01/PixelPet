[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpet"
version = "0.1.0"
description = "A virtual pet for your Windows desktop"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
pixelpet = "pixelpet.main:main"

[project.optional-dependencies]
build = [
    "PyInstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
include = ["pixelpet*"]
